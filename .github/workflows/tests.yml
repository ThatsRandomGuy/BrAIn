name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[vision,dev]"
      - run: python -m ruff check brain_pixels tests tools
      - run: python -m ruff format --check brain_pixels tests tools
      - run: python tools/run_checks.py
      - run: python tools/verify_evidence.py
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel . --no-deps --wheel-dir artifacts/wheels
      - run: python tools/smoke_wheel.py artifacts/wheels/*.whl
